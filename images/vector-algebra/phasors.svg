<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">เฟสเซอร์</title><desc id="desc">เฟสเซอร์เป็นเวกเตอร์หมุนบนระนาบเชิงซ้อน ส่วนจริงคือสัญญาณเวลา</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="20" fill="#172029"/><g font-family="sans-serif" font-size="23" fill="#e7ecf1"><line x1="60.0" y1="240.0" x2="420.0" y2="240.0" stroke="#94a3b8" stroke-width="3"/><line x1="230.0" y1="400.0" x2="230.0" y2="60.0" stroke="#94a3b8" stroke-width="3"/><text x="426" y="247" fill="#e7ecf1" font-size="23">Re</text><text x="220" y="52" fill="#e7ecf1" font-size="23">Im</text><circle cx="230" cy="240" r="150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 6"/><line x1="230.0" y1="240.0" x2="344.9" y2="143.6" stroke="#f07a3e" stroke-width="5" marker-end="url(#arrow)"/><text x="353" y="138" fill="#f07a3e" font-size="23">V</text><line x1="344.9" y1="143.6" x2="344.9" y2="240.0" stroke="#f07a3e" stroke-width="2" stroke-dasharray="6 6"/><path d="M285.0 240.0 A55 55 0 0 0 272.1 204.6" fill="none" stroke="#6bd09a" stroke-width="3"/><text x="292" y="224" fill="#6bd09a" font-size="23">φ</text><path d="M350 90 A 175 175 0 0 0 260 68" fill="none" stroke="#6bd09a" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="80" fill="#6bd09a" font-size="23">ω</text><text x="450" y="110" fill="#e7ecf1" font-size="27">V = Vm ∠ φ</text><text x="450" y="155" fill="#e7ecf1" font-size="27">= a + jb</text><text x="450" y="330" fill="#72b2f1" font-size="22">v(t) = Vm cos(ωt + φ)</text></g></svg>