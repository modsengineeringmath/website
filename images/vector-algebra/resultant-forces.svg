<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">แรงลัพธ์ด้วยกฎของไซน์และโคไซน์</title><desc id="desc">สี่เหลี่ยมด้านขนานของแรงสองแรงกับแรงลัพธ์ และกฎของโคไซน์</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="20" fill="#172029"/><g font-family="sans-serif" font-size="23" fill="#e7ecf1"><line x1="110.0" y1="340.0" x2="440.0" y2="340.0" stroke="#f07a3e" stroke-width="5" marker-end="url(#arrow)"/><line x1="110.0" y1="340.0" x2="257.8" y2="163.8" stroke="#72b2f1" stroke-width="5" marker-end="url(#arrow)"/><line x1="440.0" y1="340.0" x2="587.8" y2="163.8" stroke="#72b2f1" stroke-width="2" stroke-dasharray="8 6"/><line x1="257.8" y1="163.8" x2="587.8" y2="163.8" stroke="#f07a3e" stroke-width="2" stroke-dasharray="8 6"/><line x1="110.0" y1="340.0" x2="587.8" y2="163.8" stroke="#6bd09a" stroke-width="6" marker-end="url(#arrow)"/><text x="410" y="372" fill="#f07a3e" font-size="23">F₁</text><text x="218" y="156" fill="#72b2f1" font-size="23">F₂</text><text x="598" y="159" fill="#6bd09a" font-size="23">R</text><path d="M170.0 340.0 A60 60 0 0 0 148.6 294.0" fill="none" stroke="#e7ecf1" stroke-width="3"/><text x="176" y="322" fill="#e7ecf1" font-size="23">θ</text><text x="70" y="60" fill="#e7ecf1" font-size="25">R² = F₁² + F₂² + 2F₁F₂ cos θ</text><text x="70" y="98" fill="#94a3b8" font-size="22">sin φ / F₂ = sin θ′ / R</text></g></svg>