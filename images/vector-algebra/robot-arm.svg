<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">เวกเตอร์กับแขนกล</title><desc id="desc">แขนกลสองข้อต่อ จลนศาสตร์ไปข้างหน้า และแรงบิดจากจาโคเบียน</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="20" fill="#172029"/><g font-family="sans-serif" font-size="23" fill="#e7ecf1"><rect x="130" y="360" width="100" height="22" rx="4" fill="#2a3946"/><line x1="180.0" y1="360.0" x2="277.5" y2="220.7" stroke="#f07a3e" stroke-width="9"/><line x1="277.5" y1="220.7" x2="415.4" y2="245.1" stroke="#72b2f1" stroke-width="9"/><circle cx="180" cy="360" r="11" fill="#172029" stroke="#e7ecf1" stroke-width="4"/><circle cx="277.5" cy="220.7" r="11" fill="#172029" stroke="#e7ecf1" stroke-width="4"/><circle cx="415.4" cy="245.1" r="9" fill="#6bd09a"/><path d="M235.0 360.0 A55 55 0 0 0 211.5 314.9" fill="none" stroke="#e7ecf1" stroke-width="3"/><text x="240" y="335" fill="#e7ecf1" font-size="23">θ₁</text><line x1="277.5" y1="220.7" x2="357.5" y2="220.7" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><text x="338" y="251" fill="#e7ecf1" font-size="23">θ₂</text><line x1="415.4" y1="245.1" x2="415.4" y2="335.1" stroke="#f2c94c" stroke-width="4" marker-end="url(#arrow)"/><text x="425" y="325" fill="#f2c94c" font-size="23">W</text><text x="405" y="225" fill="#6bd09a" font-size="23">(x, y)</text><text x="420" y="70" fill="#e7ecf1" font-size="21">x = L₁cos θ₁ + L₂cos(θ₁+θ₂)</text><text x="420" y="105" fill="#e7ecf1" font-size="21">y = L₁sin θ₁ + L₂sin(θ₁+θ₂)</text><text x="420" y="150" fill="#6bd09a" font-size="25">τ = Jᵀ F</text></g></svg>