<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">การบวกเวกเตอร์</title><desc id="desc">ต่อหัวกับหาง A=3,1 บวก B=2,3 ได้5,4</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="20" fill="#172029"/><g font-family="sans-serif" font-size="23" fill="#e7ecf1"><line x1="100" y1="350" x2="645" y2="350" stroke="#94a3b8" stroke-width="3"/><line x1="100" y1="350" x2="100" y2="45" stroke="#94a3b8" stroke-width="3"/><text x="653" y="357" fill="#e7ecf1" font-size="23">x</text><text x="83" y="33" fill="#e7ecf1" font-size="23">y</text><text x="76" y="378" fill="#e7ecf1" font-size="23">O</text><line x1="100" y1="350" x2="280" y2="290" stroke="#f07a3e" stroke-width="5" marker-end="url(#arrow)"/><line x1="280" y1="290" x2="400" y2="110" stroke="#72b2f1" stroke-width="5" marker-end="url(#arrow)"/><line x1="100" y1="350" x2="400" y2="110" stroke="#6bd09a" stroke-width="5" marker-end="url(#arrow)"/><line x1="100" y1="350" x2="220" y2="170" stroke="#72b2f1" stroke-width="3" stroke-dasharray="8 6"/><line x1="220" y1="170" x2="400" y2="110" stroke="#f07a3e" stroke-width="3" stroke-dasharray="8 6"/><text x="190" y="320" fill="#f07a3e" font-size="23">A</text><text x="350" y="245" fill="#72b2f1" font-size="23">B</text><text x="370" y="82" fill="#6bd09a" font-size="31">A + B</text><text x="145" y="416" fill="#e7ecf1" font-size="25">(3, 1) + (2, 3) = (5, 4)</text></g></svg>