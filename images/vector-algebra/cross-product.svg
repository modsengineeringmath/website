<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">ผลคูณไขว้สามมิติ</title><desc id="desc">ภาพฉายฐานสามมิติแบบมือขวา i cross j เป็น k; สลับลำดับเปลี่ยนเครื่องหมาย</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="20" fill="#172029"/><g font-family="sans-serif" font-size="23" fill="#e7ecf1"><line x1="340" y1="230" x2="590" y2="310" stroke="#f07a3e" stroke-width="5" marker-end="url(#arrow)"/><line x1="340" y1="230" x2="150" y2="320" stroke="#72b2f1" stroke-width="5" marker-end="url(#arrow)"/><line x1="340" y1="230" x2="340" y2="70" stroke="#6bd09a" stroke-width="5" marker-end="url(#arrow)"/><line x1="590" y1="310" x2="400" y2="400" stroke="#72b2f1" stroke-width="3" stroke-dasharray="8 6"/><line x1="150" y1="320" x2="400" y2="400" stroke="#f07a3e" stroke-width="3" stroke-dasharray="8 6"/><text x="579" y="285" fill="#f07a3e" font-size="23">A = î</text><text x="50" y="315" fill="#72b2f1" font-size="23">B = ĵ</text><text x="362" y="89" fill="#6bd09a" font-size="23">A × B = k̂</text><text x="120" y="36" fill="#e7ecf1" font-size="26">RIGHT-HANDED 3D BASIS</text><text x="145" y="434" fill="#e7ecf1" font-size="26">î × ĵ = k̂    ·    ĵ × î = −k̂</text></g></svg>