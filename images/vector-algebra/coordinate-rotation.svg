<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">การหมุนแกนพิกัด</title><desc id="desc">แกนพิกัดหมุนไปมุม θ กับเมทริกซ์การหมุนที่ตั้งฉากและมีดีเทอร์มิแนนต์หนึ่ง</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="20" fill="#172029"/><g font-family="sans-serif" font-size="23" fill="#e7ecf1"><line x1="70.0" y1="250.0" x2="410.0" y2="250.0" stroke="#94a3b8" stroke-width="3"/><line x1="230.0" y1="400.0" x2="230.0" y2="70.0" stroke="#94a3b8" stroke-width="3"/><text x="418" y="257" fill="#e7ecf1" font-size="23">x</text><text x="223" y="62" fill="#e7ecf1" font-size="23">y</text><line x1="230.0" y1="250.0" x2="385.9" y2="160.0" stroke="#72b2f1" stroke-width="3" marker-end="url(#arrow)"/><text x="392" y="154" fill="#72b2f1" font-size="23">x′</text><line x1="230.0" y1="250.0" x2="140.0" y2="94.1" stroke="#72b2f1" stroke-width="3" marker-end="url(#arrow)"/><text x="146" y="88" fill="#72b2f1" font-size="23">y′</text><line x1="230.0" y1="250.0" x2="289.2" y2="123.1" stroke="#f07a3e" stroke-width="5" marker-end="url(#arrow)"/><text x="297" y="119" fill="#f07a3e" font-size="23">v</text><path d="M300.0 250.0 A70 70 0 0 0 290.6 215.0" fill="none" stroke="#6bd09a" stroke-width="3"/><text x="308" y="236" fill="#6bd09a" font-size="23">θ</text><text x="440" y="150" fill="#e7ecf1" font-size="21">x′ = x cos θ + y sin θ</text><text x="440" y="185" fill="#e7ecf1" font-size="21">y′ = −x sin θ + y cos θ</text><text x="440" y="240" fill="#6bd09a" font-size="25">Rᵀ R = I</text><text x="440" y="280" fill="#6bd09a" font-size="25">det R = +1</text></g></svg>