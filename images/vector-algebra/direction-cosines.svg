<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">ทิศทางโคไซน์</title><desc id="desc">มุมของเวกเตอร์แรงกับแกน x y z และเอกลักษณ์ผลรวมกำลังสองของโคไซน์เท่ากับหนึ่ง</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="20" fill="#172029"/><g font-family="sans-serif" font-size="23" fill="#e7ecf1"><line x1="250.0" y1="265.0" x2="450.1" y2="380.0" stroke="#94a3b8" stroke-width="3"/><text x="458" y="388" fill="#e7ecf1" font-size="23">x</text><line x1="250.0" y1="265.0" x2="49.9" y2="380.0" stroke="#94a3b8" stroke-width="3"/><text x="28" y="388" fill="#e7ecf1" font-size="23">y</text><line x1="250.0" y1="265.0" x2="250.0" y2="35.0" stroke="#94a3b8" stroke-width="3"/><text x="258" y="27" fill="#e7ecf1" font-size="23">z</text><line x1="250.0" y1="265.0" x2="380.5" y2="210.0" stroke="#f07a3e" stroke-width="5" marker-end="url(#arrow)"/><line x1="380.5" y1="210.0" x2="432.7" y2="370.0" stroke="#72b2f1" stroke-width="2" stroke-dasharray="6 6"/><line x1="380.5" y1="210.0" x2="197.8" y2="295.0" stroke="#6bd09a" stroke-width="2" stroke-dasharray="6 6"/><line x1="380.5" y1="210.0" x2="250.0" y2="75.0" stroke="#f2c94c" stroke-width="2" stroke-dasharray="6 6"/><text x="390" y="204" fill="#f07a3e" font-size="23">F</text><text x="290" y="243" fill="#72b2f1" font-size="23">α</text><text x="202" y="245" fill="#6bd09a" font-size="23">β</text><text x="258" y="185" fill="#f2c94c" font-size="23">γ</text><text x="470" y="150" fill="#72b2f1" font-size="23">cos α = Fx/|F|</text><text x="470" y="190" fill="#6bd09a" font-size="23">cos β = Fy/|F|</text><text x="470" y="230" fill="#f2c94c" font-size="23">cos γ = Fz/|F|</text><text x="230" y="420" fill="#e7ecf1" font-size="27">cos²α + cos²β + cos²γ = 1</text></g></svg>