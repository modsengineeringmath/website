<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">เวกเตอร์ ขนาด และองค์ประกอบ</title><desc id="desc">เวกเตอร์ 4,3 มีขนาด5 และเวกเตอร์หนึ่งหน่วย 4ส่วน5,3ส่วน5</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="20" fill="#172029"/><g font-family="sans-serif" font-size="23" fill="#e7ecf1"><line x1="100" y1="350" x2="645" y2="350" stroke="#94a3b8" stroke-width="3"/><line x1="100" y1="350" x2="100" y2="45" stroke="#94a3b8" stroke-width="3"/><text x="653" y="357" fill="#e7ecf1" font-size="23">x</text><text x="83" y="33" fill="#e7ecf1" font-size="23">y</text><text x="76" y="378" fill="#e7ecf1" font-size="23">O</text><line x1="100" y1="350" x2="340" y2="170" stroke="#f07a3e" stroke-width="5" marker-end="url(#arrow)"/><line x1="100" y1="350" x2="340" y2="350" stroke="#72b2f1" stroke-width="4" marker-end="url(#arrow)"/><line x1="340" y1="350" x2="340" y2="170" stroke="#6bd09a" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="340" y="130" fill="#f07a3e" font-size="23">A = (4, 3)</text><text x="200" y="387" fill="#72b2f1" font-size="23">Ax = 4</text><text x="359" y="270" fill="#6bd09a" font-size="23">Ay = 3</text><text x="470" y="110" fill="#f07a3e" font-size="31">|A| = 5</text><text x="468" y="158" fill="#e7ecf1" font-size="21">û = (4/5, 3/5)</text></g></svg>