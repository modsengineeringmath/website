# After each push to main that changes the sitemap, wait for Cloudflare to deploy it, then tell search engines
# (IndexNow: Bing, Yandex, Naver, Seznam, Yep) which pages are new, updated or removed. Google reads the sitemap itself.
# Run it by hand from the Actions tab ("Run workflow", tick "all") to resubmit every page.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ["sitemap.xml"]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in the sitemap"
        type: boolean
        default: false
      from:
        description: "Optional: compare with this commit instead of the previous one (pages removed since then are sent too)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Submit changed pages
        run: node scripts/indexnow.mjs --from "${{ inputs.from || github.event.before }}" --to "${{ github.sha }}" --wait ${{ inputs.all && '--all' || '' }}
